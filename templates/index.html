<!DOCTYPE html>
<html>

<head>

<title>AI Gift Recommendation System</title>

<style>

body {
    font-family: Arial, sans-serif;
    background-color: #f2f2f2;
    margin: 0;
    padding: 30px;
}

.container {
    max-width: 750px;
    margin: auto;
    background-color: white;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 0 15px #aaa;
}

h1 {
    text-align: center;
    color: #333;
}

label {
    display: block;
    margin-top: 15px;
    font-weight: bold;
}

input, select {
    width: 100%;
    padding: 11px;
    margin-top: 6px;
    box-sizing: border-box;
    border: 1px solid #ccc;
    border-radius: 6px;
}

button {
    width: 100%;
    padding: 13px;
    margin-top: 20px;
    background-color: #4CAF50;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background-color: #45a049;
}

.results {
    margin-top: 30px;
}

.results h2 {
    text-align: center;
    color: #333;
}

.card {
    background-color: #fafafa;
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 20px;
    margin-top: 18px;
    box-shadow: 0 2px 6px #ddd;
}

.card h3 {
    margin-top: 0;
    color: #333;
}

.price {
    font-size: 18px;
    font-weight: bold;
    color: #4CAF50;
}

.card p {
    line-height: 1.6;
}

</style>

</head>

<body>

<div class="container">

<h1>🎁 AI Gift Recommendation System</h1>

<form method="POST">

<label>Age</label>
<input type="number" name="age" required>

<label>Relationship</label>

<select name="relationship">
<option>Friend</option>
<option>Father</option>
<option>Mother</option>
<option>Brother</option>
<option>Sister</option>
<option>Partner</option>
<option>Colleague</option>
</select>

<label>Occasion</label>

<select name="occasion">
<option>Birthday</option>
<option>Anniversary</option>
<option>Wedding</option>
<option>Graduation</option>
<option>Farewell</option>
<option>Festival</option>
</select>

<label>Interests</label>

<input
type="text"
name="interests"
placeholder="Example: Music, Gaming, Photography"
required>

<label>Budget (₹)</label>

<input
type="number"
name="budget"
placeholder="Example: 2000"
required>

<button type="submit">
🎁 Get Gift Recommendations
</button>

</form>


{% if recommendations %}

<div class="results">

<h2>🎁 Recommended Gifts</h2>

{% for gift in recommendations %}

<div class="card">

<h3>{{ loop.index }}. {{ gift.name }}</h3>

<p class="price">{{ gift.price }}</p>

<p>
<strong>Why it is suitable:</strong><br>
{{ gift.why }}
</p>

<p>
<strong>Description:</strong><br>
{{ gift.description }}
</p>

</div>

{% endfor %}

</div>

{% endif %}

</div>

</body>

</html>
