<!DOCTYPE html>
<html>

<head>

<title>AI Gift Recommendation System</title>

<style>

body {
    font-family: Arial;
    background-color: #f2f2f2;
    margin: 0;
    padding: 30px;
}

.container {
    width: 600px;
    margin: auto;
    background-color: white;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 0 15px #aaa;
}

h1 {
    text-align: center;
    color: #333;
}

label {
    display: block;
    margin-top: 15px;
    font-weight: bold;
}

input, select {
    width: 100%;
    padding: 10px;
    margin-top: 5px;
    box-sizing: border-box;
}

button {
    width: 100%;
    padding: 12px;
    margin-top: 20px;
    background-color: #4CAF50;
    color: white;
    border: none;
    border-radius: 5px;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background-color: #45a049;
}

.result {
    margin-top: 25px;
    padding: 20px;
    background-color: #f5f5f5;
    border-radius: 10px;
    white-space: pre-wrap;
}

</style>

</head>

<body>

<div class="container">

<h1>🎁 AI Gift Recommendation System</h1>

<form method="POST">

<label>Age</label>
<input type="number" name="age" required>

<label>Relationship</label>

<select name="relationship">

<option>Friend</option>
<option>Father</option>
<option>Mother</option>
<option>Brother</option>
<option>Sister</option>
<option>Partner</option>
<option>Colleague</option>

</select>

<label>Occasion</label>

<select name="occasion">

<option>Birthday</option>
<option>Anniversary</option>
<option>Wedding</option>
<option>Graduation</option>
<option>Farewell</option>
<option>Festival</option>

</select>

<label>Interests</label>

<input
type="text"
name="interests"
placeholder="Example: Music, Gaming, Photography"
required>

<label>Budget (₹)</label>

<input
type="number"
name="budget"
placeholder="Example: 2000"
required>

<button type="submit">
🎁 Get Gift Recommendations
</button>

</form>

{% if recommendations %}

<div class="result">

<h2>🎁 Recommended Gifts</h2>

{{ recommendations }}

</div>

{% endif %}

</div>

</body>

</html>
